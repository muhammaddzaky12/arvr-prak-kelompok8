<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Kelompok 8 - Minggu 2 (Scene v1)</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- ===== PENCAHAYAAN ===== -->
    <!-- Cahaya merata supaya tidak ada sisi yang gelap total -->
    <a-light id="lampu-ambient" type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <!-- Cahaya searah seperti matahari, memberi kesan volume pada objek -->
    <a-light id="lampu-directional" type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

    <!-- ===== SCENE UTAMA (menempel pada marker Hiro) ===== -->
    <a-marker preset="hiro">
    <!-- Alas: bidang datar (diputar -90 derajat agar rebah) -->
          <a-plane position="0 0 0" rotation="-90 0 0" width="2" height="2"
          color="#e9e5fa" opacity="0.7" transparent="true"></a-plane>
          <!-- Objek 1: kubus (warna solid) -->
          <a-box position="-0.6 0.75 0" width="0.5" height="0.5" depth="0.5"
          color="#4C6EF5" animation="property: rotation; to: 0 45 0; dur: 6000; loop: true; easing: linear"></a-box>
          <!-- Objek 2: bola (material: metalness & roughness) -->
          <a-sphere position="0 0.3 0" radius="0.3"
          color="#D9531E" metalness="0.3" roughness="0.4" scale="1 2 1"></a-sphere>
          <!-- Objek 3: silinder + animasi rotasi -->
          <a-cylinder position="0.6 0.3 0" radius="0.2" height="0.6" color="#0B7F73"
          animation="property: rotation; to: 360 0 0; dur: 4000; loop: true; easing: linear">
          </a-cylinder>
          <!-- Objek 4: kotak bertekstur (gambar dari folder assets) -->
          <a-box position="0 0.15 -0.7" width="0.5" height="0.3" depth="0.5"
          src="assets/tekstur.jpg"></a-box>
    </a-marker>


    <!-- Kamera (wajib untuk AR.js) -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
